<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round display check</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
  main {
    width: min(100vw, 100vh); height: min(100vw, 100vh); position: relative;
    overflow: hidden; border-radius: 50%; container-type: inline-size;
    background: #4b4f5a; color: #fff;
  }
  @media (aspect-ratio: 4 / 3) { main { transform: scaleX(1.3333333333); } }
  main[data-pattern="gradient"] { background: linear-gradient(#20232b, #707781); }
  header { position: absolute; top: 17%; left: 20%; width: 60%; text-align: center; }
  h1 { margin: 0; font-size: 5.5cqw; }
  p { margin: 2cqw 0 0; font-size: 3cqw; line-height: 1.4; }
  .sample { position: absolute; top: 43%; width: 100%; text-align: center; font-size: 8cqw; font-weight: 600; }
  .sample small { display: block; font-size: 3cqw; margin-top: 2cqw; font-weight: 400; }
  nav { position: absolute; top: 71%; left: 20%; width: 60%; display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; }
  button, a {
    min-height: 11cqw; padding: 1.5cqw; border: 1px solid #a5acb7; border-radius: 3cqw;
    background: #1c2028; color: #fff; font: 600 3cqw system-ui, sans-serif;
    text-decoration: none; display: grid; place-items: center; touch-action: manipulation;
  }
  button[aria-pressed="true"] { background: #d9f58f; color: #162014; border-color: #d9f58f; }
  a { grid-column: 1 / -1; justify-self: center; width: 70%; min-height: 9cqw; }
</style>
<main data-pattern="flat">
  <header>
    <h1 id="heading">Flat gray</h1>
    <p>Check whether the same lines are visible.</p>
  </header>
  <div class="sample">0123456789<small>Native browser text · no video</small></div>
  <nav aria-label="Display checks">
    <button type="button" data-pattern="flat" aria-pressed="true">Flat gray</button>
    <button type="button" data-pattern="gradient" aria-pressed="false">Gradient</button>
    <a href="/">Return to map</a>
  </nav>
</main>
<script>
  const display = document.querySelector('main');
  const heading = document.querySelector('#heading');
  const buttons = document.querySelectorAll('button[data-pattern]');
  for (const button of buttons) button.addEventListener('click', () => {
    display.dataset.pattern = button.dataset.pattern;
    heading.textContent = button.textContent;
    for (const other of buttons) other.setAttribute('aria-pressed', String(other === button));
  });
</script>
</html>
